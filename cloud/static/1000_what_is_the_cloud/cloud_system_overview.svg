<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc">
  <title id="title">How a cloud provider system fits together</title>
  <desc id="desc">End users and builders reach the cloud over the internet using console, CLI, and APIs. Inside: identity, region, virtual network, compute, data, messaging, and observability.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6d28d9"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a21caf"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1400" height="1180" fill="#f8fafc"/>

  <text x="700" y="36" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="26">How a cloud provider system fits together</text>
  <text x="700" y="62" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="14">Generic picture - the same map on AWS, Azure, and GCP (names differ)</text>

  <!-- People -->
  <rect x="40" y="100" width="220" height="280" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="130" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">People outside the cloud</text>

  <rect x="60" y="150" width="180" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="150" y="180" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">End users</text>
  <text x="150" y="200" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">browsers / mobile apps</text>

  <rect x="60" y="235" width="180" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="150" y="265" text-anchor="middle" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Builders</text>
  <text x="150" y="285" text-anchor="middle" fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="12">developers / operators</text>

  <text x="150" y="340" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">They never touch the</text>
  <text x="150" y="356" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">physical data center</text>

  <line x1="260" y1="240" x2="310" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Internet -->
  <ellipse cx="370" cy="240" rx="55" ry="40" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="370" y="236" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Internet</text>
  <text x="370" y="254" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">public network</text>

  <line x1="425" y1="240" x2="480" y2="240" stroke="#475569" stroke-width="2"/>

  <!-- Access methods -->
  <rect x="480" y="100" width="200" height="280" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="130" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">How you talk to it</text>

  <rect x="500" y="150" width="160" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="580" y="180" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Web console</text>

  <rect x="500" y="215" width="160" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="580" y="245" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">CLI</text>

  <rect x="500" y="280" width="160" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="580" y="310" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">APIs / SDKs</text>

  <text x="580" y="360" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">Same cloud, three doors</text>

  <line x1="680" y1="240" x2="740" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="710" y="228" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11">HTTPS</text>

  <!-- Cloud provider -->
  <rect x="740" y="90" width="620" height="980" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="1050" y="120" text-anchor="middle" fill="#1e3a8a" font-family="Georgia, 'Times New Roman', serif" font-size="20">Cloud provider</text>
  <text x="1050" y="142" text-anchor="middle" fill="#3b82f6" font-family="Arial, Helvetica, sans-serif" font-size="12">shared physical data centers + managed software services</text>

  <!-- IAM -->
  <rect x="770" y="165" width="560" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1050" y="195" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Identity &amp; access (IAM / Entra ID / Cloud IAM)</text>
  <text x="1050" y="218" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="12">Who may create, change, or use resources - every request is checked here first</text>

  <text x="760" y="250" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">control plane</text>
  <line x1="1050" y1="235" x2="1050" y2="255" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Region -->
  <rect x="770" y="255" width="560" height="580" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="790" y="280" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">One Region (example)</text>
  <text x="790" y="298" fill="#0284c7" font-family="Arial, Helvetica, sans-serif" font-size="11">A geographic place with several Availability Zones / zones</text>

  <!-- Virtual network -->
  <rect x="790" y="315" width="520" height="430" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="810" y="340" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Virtual network (VPC / VNet)</text>
  <text x="810" y="358" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="11">Your private address space: subnets, routes, firewall rules</text>

  <rect x="810" y="375" width="150" height="55" rx="8" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="885" y="400" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Edge / gateway</text>
  <text x="885" y="418" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="10">Internet in/out</text>

  <rect x="985" y="375" width="150" height="55" rx="8" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="1060" y="400" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Load balancer</text>
  <text x="1060" y="418" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="10">spreads traffic</text>

  <rect x="1160" y="375" width="130" height="55" rx="8" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="1225" y="400" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">DNS</text>
  <text x="1225" y="418" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="10">names to addresses</text>

  <line x1="885" y1="430" x2="885" y2="455" stroke="#6d28d9" stroke-width="1.5"/>
  <line x1="885" y1="455" x2="1060" y2="455" stroke="#6d28d9" stroke-width="1.5"/>
  <line x1="1060" y1="430" x2="1060" y2="470" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- Compute -->
  <rect x="810" y="470" width="480" height="95" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="830" y="495" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Compute (runs your code)</text>

  <rect x="830" y="508" width="130" height="42" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="895" y="534" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="12">VMs</text>

  <rect x="980" y="508" width="130" height="42" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="1045" y="534" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="12">Containers</text>

  <rect x="1130" y="508" width="140" height="42" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="1200" y="534" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="12">Functions</text>

  <!-- Data + storage -->
  <rect x="810" y="580" width="230" height="80" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="925" y="608" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Data platforms</text>
  <text x="925" y="630" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">Managed SQL / NoSQL</text>
  <text x="925" y="646" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">databases</text>

  <rect x="1060" y="580" width="230" height="80" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1175" y="608" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Storage</text>
  <text x="1175" y="630" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">Object buckets, disks,</text>
  <text x="1175" y="646" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">file shares</text>

  <!-- Messaging -->
  <rect x="810" y="675" width="480" height="55" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="1050" y="698" text-anchor="middle" fill="#86198f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Messaging &amp; events</text>
  <text x="1050" y="718" text-anchor="middle" fill="#a21caf" font-family="Arial, Helvetica, sans-serif" font-size="11">Queues, topics, event buses - async talk between services</text>

  <line x1="960" y1="565" x2="925" y2="580" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="1100" y1="565" x2="1175" y2="580" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="1050" y1="565" x2="1050" y2="675" stroke="#a21caf" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="1288" y="620" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="10">read/write</text>
  <text x="1275" y="700" fill="#a21caf" font-family="Arial, Helvetica, sans-serif" font-size="10">pub/sub</text>

  <!-- Observability (in region, below VNet) -->
  <rect x="790" y="760" width="520" height="55" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="1050" y="783" text-anchor="middle" fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Observability</text>
  <text x="1050" y="802" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11">Metrics, logs, traces, alarms - watches compute, data, and networking</text>

  <line x1="900" y1="565" x2="860" y2="760" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="1175" y1="660" x2="1200" y2="760" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Ops / IaC -->
  <rect x="770" y="860" width="560" height="80" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1050" y="890" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Ops &amp; Infrastructure as Code</text>
  <text x="1050" y="912" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">Templates and scripts (CloudFormation, Bicep, Terraform...) create the boxes above</text>
  <text x="1050" y="930" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">usually driven by the same CLI / APIs builders already use</text>

  <!-- Two kinds of traffic -->
  <rect x="40" y="420" width="640" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="450" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Two kinds of traffic (easy to confuse)</text>

  <rect x="60" y="470" width="280" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="200" y="500" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">1. Application traffic</text>
  <text x="200" y="522" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">End users hit your app</text>
  <text x="200" y="540" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">Internet -&gt; DNS -&gt; load balancer</text>
  <text x="200" y="558" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">-&gt; compute -&gt; data / storage</text>

  <rect x="360" y="470" width="300" height="120" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="510" y="500" text-anchor="middle" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">2. Control / management</text>
  <text x="510" y="522" text-anchor="middle" fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="11">Builders change the cloud</text>
  <text x="510" y="540" text-anchor="middle" fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="11">Console / CLI / API -&gt; IAM</text>
  <text x="510" y="558" text-anchor="middle" fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="11">-&gt; create networks, VMs, databases...</text>

  <!-- Story -->
  <rect x="40" y="650" width="640" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="685" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Read the picture as a story</text>

  <text x="60" y="720" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">1. People connect over the Internet.</text>
  <text x="60" y="745" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">2. Builders use Console, CLI, or APIs; end users use your website or app.</text>
  <text x="60" y="770" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">3. Identity checks every management action (and often app access too).</text>
  <text x="60" y="795" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">4. Work lives in a Region, inside your Virtual network.</text>
  <text x="60" y="820" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">5. Edge, DNS, and load balancers bring user traffic to Compute.</text>
  <text x="60" y="845" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">6. Compute talks to Databases, Storage, and Messaging to do real work.</text>
  <text x="60" y="870" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">7. Observability watches health; alarms tell you when something breaks.</text>
  <text x="60" y="895" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">8. IaC / ops scripts rebuild the same layout safely and repeatedly.</text>

  <text x="60" y="940" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Name cheat-sheet (same idea, three catalogs)</text>
  <text x="60" y="968" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Virtual network: VPC (AWS/GCP) � VNet (Azure)</text>
  <text x="60" y="990" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Compute VMs: EC2 � Virtual Machines � Compute Engine</text>
  <text x="60" y="1012" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Object storage: S3 � Blob Storage � Cloud Storage</text>
  <text x="60" y="1034" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Identity: IAM � Microsoft Entra ID + RBAC � Cloud IAM</text>

  <path d="M150 150 C 300 80, 900 80, 1050 165" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="95" fill="#0284c7" font-family="Arial, Helvetica, sans-serif" font-size="11">end-user path (to your app)</text>
</svg>
