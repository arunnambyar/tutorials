<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Entra ID and billing inside the tenant</title>
  <desc id="desc">Entra ID for sign-in and billing account for payment sit with the Root MG inside the tenant.</desc>
  <rect width="920" height="460" fill="#f8fafc"/>
  <text x="460" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">3. Entra ID and billing</text>
  <text x="460" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Who signs in vs who pays  split roles (not one automatic management subscription)</text>

  <rect x="40" y="75" width="840" height="270" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="60" y="100" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Tenant</text>

  <rect x="250" y="120" width="420" height="48" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="150" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Tenant Root Management Group</text>

  <line x1="460" y1="168" x2="460" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="200" x2="700" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="200" x2="220" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="200" x2="460" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="200" x2="700" y2="220" stroke="#94a3b8" stroke-width="2"/>

  <rect x="100" y="220" width="240" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="220" y="255" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Microsoft Entra ID</text>
  <text x="220" y="280" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">directory · who signs in</text>

  <rect x="360" y="220" width="200" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="460" y="255" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Billing account</text>
  <text x="460" y="280" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="12">who pays invoices</text>

  <rect x="580" y="220" width="240" height="90" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="700" y="255" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Platform subscription</text>
  <text x="700" y="280" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">optional / custom (not automatic)</text>

  <rect x="80" y="370" width="760" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="400" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Unlike AWS management account</text>
  <text x="100" y="422" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Azure does not auto-promote one subscription. Entra = sign-in. Billing account = pay. Optional platform subscription is your design.</text>
</svg>
