<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Create order starting from the management account</title>
  <desc id="desc">Create an AWS account first; it becomes the management account when you create the Organization; then that account creates OUs, member accounts, and moves them.</desc>
  <rect width="1100" height="520" fill="#f8fafc"/>
  <text x="550" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Create order — start with the management account</text>
  <text x="550" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">That account creates the Organization, then runs every later step (payer + org admin)</text>

  <!-- Step 1 -->
  <rect x="25" y="80" width="185" height="200" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="55" cy="110" r="16" fill="#dc2626"/>
  <text x="55" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="117" y="145" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create an</text>
  <text x="117" y="165" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">AWS account</text>
  <text x="117" y="195" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">normal signup</text>
  <text x="117" y="215" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">(email + bill)</text>
  <text x="117" y="245" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">future</text>
  <text x="117" y="262" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">management acct</text>

  <path d="M218 180 L245 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="255" y="80" width="185" height="200" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="285" cy="110" r="16" fill="#f8fafc"/>
  <text x="285" y="116" text-anchor="middle" fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="347" y="145" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create</text>
  <text x="347" y="165" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Organization</text>
  <text x="347" y="195" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="11">from that account</text>
  <text x="347" y="220" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">→ becomes</text>
  <text x="347" y="238" text-anchor="middle" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">management acct</text>
  <text x="347" y="258" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="11">+ Root OU appears</text>

  <path d="M448 180 L475 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <rect x="485" y="80" width="185" height="200" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="515" cy="110" r="16" fill="#ca8a04"/>
  <text x="515" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="577" y="145" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create child OUs</text>
  <text x="577" y="175" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">under Root OU</text>
  <text x="577" y="195" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">(custom names)</text>
  <text x="577" y="230" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">done by</text>
  <text x="577" y="248" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">management acct</text>

  <path d="M678 180 L705 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 4 -->
  <rect x="715" y="80" width="185" height="200" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <circle cx="745" cy="110" r="16" fill="#334155"/>
  <text x="745" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">4</text>
  <text x="807" y="145" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create / invite</text>
  <text x="807" y="165" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">member accounts</text>
  <text x="807" y="195" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11">unique email each</text>
  <text x="807" y="230" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">done by</text>
  <text x="807" y="248" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">management acct</text>

  <path d="M908 180 L935 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 5 -->
  <rect x="945" y="80" width="130" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="975" cy="110" r="16" fill="#059669"/>
  <text x="975" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">5</text>
  <text x="1010" y="155" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Move</text>
  <text x="1010" y="175" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">members</text>
  <text x="1010" y="195" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">into OUs</text>
  <text x="1010" y="230" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">done by</text>
  <text x="1010" y="248" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">mgmt acct</text>

  <!-- Role banner -->
  <rect x="25" y="310" width="1050" height="175" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="50" y="345" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Role of the management account (through the whole flow)</text>
  <text x="50" y="375" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">1 → You create a normal AWS account first (this will become the management account).</text>
  <text x="50" y="400" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">2 → From that account you create the Organization. It becomes the management account; Root OU appears automatically.</text>
  <text x="50" y="425" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">3–5 → Still signed into the management account, you create OUs, create/invite member accounts, and move them into OUs.</text>
  <text x="50" y="455" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Ongoing: pays the consolidated bill · owns org admin · keep app workloads out of this account when you can.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
