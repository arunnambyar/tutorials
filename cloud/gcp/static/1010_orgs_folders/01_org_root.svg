<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Organization root</title>
  <desc id="desc">Organization sits at the top of the GCP resource hierarchy.</desc>
  <rect width="920" height="400" fill="#f8fafc"/>
  <text x="460" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">2. Organization root</text>
  <text x="460" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Top of the company resource hierarchy</text>

  <rect x="40" y="75" width="840" height="280" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="60" y="100" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Organization</text>

  <rect x="260" y="120" width="400" height="65" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="460" y="148" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Organization</text>
  <text x="460" y="168" text-anchor="middle" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="12">company container / tree top</text>

  <line x1="460" y1="185" x2="460" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="220" x2="710" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="220" x2="210" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="220" x2="460" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="710" y1="220" x2="710" y2="245" stroke="#94a3b8" stroke-width="2"/>

  <rect x="130" y="245" width="160" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="210" y="278" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">folders later</text>
  <rect x="380" y="245" width="160" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="460" y="278" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">projects later</text>
  <rect x="630" y="245" width="160" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="710" y="278" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">policies later</text>

  <text x="460" y="380" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Labs can use projects with no Organization. Companies grow into one tree.</text>
</svg>
