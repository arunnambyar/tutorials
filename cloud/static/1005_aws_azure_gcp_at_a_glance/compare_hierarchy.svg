<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchy name map across AWS Azure GCP</title>
  <desc id="desc">Side-by-side nesting: AWS OUs and accounts, Azure management groups and subscriptions, GCP folders and projects.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="36" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="24">How each cloud organizes your work</text>
  <text x="640" y="62" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Same nesting idea - different names</text>

  <!-- AWS column -->
  <rect x="30" y="90" width="390" height="560" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="225" y="125" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AWS</text>

  <rect x="55" y="150" width="340" height="50" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="225" y="180" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Organization Root</text>

  <rect x="70" y="220" width="310" height="45" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="225" y="248" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Management Account</text>

  <rect x="70" y="285" width="310" height="45" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="225" y="313" text-anchor="middle" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">OU (folder for accounts)</text>

  <rect x="85" y="350" width="280" height="50" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="380" text-anchor="middle" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Account</text>

  <rect x="100" y="420" width="250" height="40" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="225" y="445" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="12">IAM</text>

  <rect x="100" y="480" width="250" height="40" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="225" y="505" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">Region ’ resources</text>

  <text x="225" y="560" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="12">Group apps with tags</text>
  <text x="225" y="585" text-anchor="middle" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="11">(no required resource group)</text>

  <!-- Azure column -->
  <rect x="445" y="90" width="390" height="560" rx="14" fill="#eff6ff" stroke="#0078d4" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Azure</text>

  <rect x="470" y="150" width="340" height="50" rx="8" fill="#dbeafe" stroke="#0078d4"/>
  <text x="640" y="180" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Root Management Group</text>

  <rect x="485" y="220" width="310" height="45" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="640" y="248" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Entra ID tenant</text>

  <rect x="485" y="285" width="310" height="45" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="640" y="313" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Management Group</text>

  <rect x="500" y="350" width="280" height="50" rx="8" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="640" y="380" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Subscription</text>

  <rect x="515" y="420" width="250" height="40" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="640" y="445" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">Resource group</text>

  <rect x="515" y="480" width="250" height="40" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="640" y="505" text-anchor="middle" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="12">Region ’ resources</text>

  <text x="640" y="560" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="12">RBAC on scopes</text>
  <text x="640" y="585" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">(RG is the app folder)</text>

  <!-- GCP column -->
  <rect x="860" y="90" width="390" height="560" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="1055" y="125" text-anchor="middle" fill="#174ea6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">GCP</text>

  <rect x="885" y="150" width="340" height="50" rx="8" fill="#d2e3fc" stroke="#1a73e8"/>
  <text x="1055" y="180" text-anchor="middle" fill="#174ea6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Organization</text>

  <rect x="900" y="220" width="310" height="45" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1055" y="248" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Billing Account</text>

  <rect x="900" y="285" width="310" height="45" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="1055" y="313" text-anchor="middle" fill="#1967d2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Folder</text>

  <rect x="915" y="350" width="280" height="50" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="1055" y="380" text-anchor="middle" fill="#174ea6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Project</text>

  <rect x="930" y="420" width="250" height="40" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="1055" y="445" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="12">IAM / service accounts</text>

  <rect x="930" y="480" width="250" height="40" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1055" y="505" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">Region / zone ’ resources</text>

  <text x="1055" y="560" text-anchor="middle" fill="#174ea6" font-family="Arial, Helvetica, sans-serif" font-size="12">Project is the hard boundary</text>
  <text x="1055" y="585" text-anchor="middle" fill="#1967d2" font-family="Arial, Helvetica, sans-serif" font-size="11">(labels optional)</text>

  <!-- Memory aid strip -->
  <rect x="30" y="665" width="1220" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="690" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <tspan font-weight="700">Remember:</tspan> OU H MG H Folder   ·   Account H Subscription H Project
  </text>
</svg>
