<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
  <title id="title">Subscriptions inside management groups</title>
  <desc id="desc">Tenant holds Root MG, child MGs, and subscriptions under each MG.</desc>
  <rect width="920" height="640" fill="#f8fafc"/>
  <text x="460" y="30" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">5. Multiple subscriptions</text>
  <text x="460" y="52" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Subscriptions under each MG  hard boxes for work and blast radius</text>

  <rect x="20" y="68" width="880" height="530" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="40" y="92" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Tenant</text>

  <rect x="280" y="110" width="360" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="135" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Tenant Root Management Group</text>

  <line x1="460" y1="150" x2="460" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="185" x2="760" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="185" x2="160" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="185" x2="460" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="760" y1="185" x2="760" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <rect x="50" y="210" width="220" height="320" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  <rect x="65" y="225" width="190" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="160" y="250" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Security MG</text>
  <rect x="65" y="285" width="190" height="70" rx="6" fill="#fff1f2" stroke="#f87171"/>
  <text x="160" y="315" text-anchor="middle" fill="#9f1239" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Log Archive</text>
  <text x="160" y="335" text-anchor="middle" fill="#be123c" font-family="Arial, Helvetica, sans-serif" font-size="11">subscription</text>
  <rect x="65" y="375" width="190" height="70" rx="6" fill="#fff1f2" stroke="#f87171"/>
  <text x="160" y="405" text-anchor="middle" fill="#9f1239" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Security Tooling</text>
  <text x="160" y="425" text-anchor="middle" fill="#be123c" font-family="Arial, Helvetica, sans-serif" font-size="11">subscription</text>

  <rect x="350" y="210" width="220" height="320" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <rect x="365" y="225" width="190" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="460" y="250" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Infrastructure MG</text>
  <rect x="365" y="285" width="190" height="70" rx="6" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="460" y="315" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Shared Services</text>
  <text x="460" y="335" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">subscription</text>
  <rect x="365" y="375" width="190" height="70" rx="6" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="460" y="405" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Connectivity</text>
  <text x="460" y="425" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">subscription</text>

  <rect x="650" y="210" width="220" height="320" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
  <rect x="665" y="225" width="190" height="40" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="760" y="250" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Workloads MG</text>
  <rect x="665" y="285" width="190" height="70" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="760" y="315" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">App Staging</text>
  <text x="760" y="335" text-anchor="middle" fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="11">subscription</text>
  <rect x="665" y="375" width="190" height="70" rx="6" fill="#fefce8" stroke="#eab308"/>
  <text x="760" y="405" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">App Production</text>
  <text x="760" y="425" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">subscription</text>

  <text x="460" y="570" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">All of this tree lives in one tenant. Subscriptions are still the hard walls.</text>
</svg>
