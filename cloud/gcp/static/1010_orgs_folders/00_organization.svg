<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">GCP Organization tree</title>
  <desc id="desc">Organization as drive holding folders and projects, with Cloud Identity and billing.</desc>
  <rect width="1000" height="700" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Organization tree (drive ’ folders ’ projects)</text>
  <text x="500" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Organization H drive · Folder H folder · Project H file (hard isolation box)</text>

  <rect x="40" y="75" width="920" height="570" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <rect x="40" y="75" width="920" height="48" rx="16" fill="#1e293b"/>
  <rect x="40" y="107" width="920" height="16" fill="#1e293b"/>
  <text x="500" y="105" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Organization  (like a drive)</text>

  <rect x="300" y="145" width="400" height="48" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="500" y="175" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Organization root</text>

  <line x1="500" y1="193" x2="500" y2="225" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="225" x2="880" y2="225" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="225" x2="120" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="225" x2="300" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="520" y1="225" x2="520" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="740" y1="225" x2="740" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="225" x2="880" y2="250" stroke="#94a3b8" stroke-width="2"/>

  <rect x="50" y="250" width="140" height="95" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="285" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Cloud Identity</text>
  <text x="120" y="308" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="11">who signs in</text>

  <rect x="210" y="250" width="180" height="95" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="285" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Billing account</text>
  <text x="300" y="308" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">who pays</text>

  <rect x="410" y="250" width="220" height="300" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <rect x="425" y="265" width="190" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="520" y="290" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Security Folder</text>
  <rect x="430" y="325" width="180" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="520" y="347" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Log Archive</text>
  <text x="520" y="363" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">project</text>
  <rect x="430" y="390" width="180" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="520" y="412" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Security Tooling</text>
  <text x="520" y="428" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">project</text>

  <rect x="650" y="250" width="180" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="660" y="265" width="160" height="40" rx="8" fill="#bae6fd" stroke="#0284c7"/>
  <text x="740" y="290" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Infra Folder</text>
  <rect x="665" y="325" width="150" height="45" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="740" y="352" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Shared Svcs</text>
  <rect x="665" y="385" width="150" height="45" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="740" y="412" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Network Host</text>

  <rect x="850" y="250" width="100" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="900" y="320" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Workloads</text>
  <text x="900" y="340" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Folder</text>
  <text x="900" y="375" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="10">can nest</text>

  <text x="500" y="620" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Drive = Organization · Folder = folder · File = project (the real isolation box)</text>
</svg>
