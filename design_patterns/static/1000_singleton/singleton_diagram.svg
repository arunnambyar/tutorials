<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827" stroke="none"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="744" height="404" rx="18" fill="#f3f4f6" stroke="#1e3a8a" stroke-width="3"/>

  <text x="380" y="48" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700" font-style="italic" fill="#dc2626">
    Singleton pattern – Class diagram
  </text>

  <!-- Client: x=70..220, y=170..260 -->
  <rect x="70" y="170" width="150" height="90" fill="#ffffff" stroke="#111827" stroke-width="2" rx="2"/>
  <line x1="70" y1="205" x2="220" y2="205" stroke="#111827" stroke-width="2"/>
  <line x1="70" y1="235" x2="220" y2="235" stroke="#111827" stroke-width="2"/>
  <text x="145" y="196" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" font-style="italic" fill="#111827">Client</text>

  <!-- Singleton: x=430..680, y=130..280 -->
  <rect x="430" y="130" width="250" height="150" fill="#ffffff" stroke="#111827" stroke-width="2" rx="2"/>
  <line x1="430" y1="165" x2="680" y2="165" stroke="#111827" stroke-width="2"/>
  <line x1="430" y1="205" x2="680" y2="205" stroke="#111827" stroke-width="2"/>
  <text x="555" y="156" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="18" font-style="italic" fill="#111827">Singleton</text>
  <text x="445" y="192" font-family="Consolas, monospace" font-size="14" fill="#111827">- singletonInstance : Singleton</text>
  <text x="445" y="232" font-family="Consolas, monospace" font-size="14" fill="#111827">+ getInstance() : Singleton</text>

  <!-- use: Client right edge -> Singleton left edge -->
  <line x1="220" y1="215" x2="421" y2="215" stroke="#111827" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="205" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#111827">use</text>

  <!-- new: Singleton right edge -> up -> back into Singleton top edge -->
  <path
    d="M 680 172
       L 718 172
       L 718 78
       L 555 78
       L 555 129"
    fill="none"
    stroke="#111827"
    stroke-width="2"
    stroke-linejoin="round"
    marker-end="url(#arrowhead)"
  />
  <text x="636" y="68" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#111827">new</text>
</svg>
