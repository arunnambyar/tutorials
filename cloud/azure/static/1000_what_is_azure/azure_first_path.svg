<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">A typical first path on Azure</title>
  <desc id="desc">Sign in with Entra ID, pick subscription and region, create a resource group, deploy resources, then manage via portal CLI APIs or IaC.</desc>
  <rect width="1200" height="640" fill="#f8fafc"/>

  <text x="600" y="38" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="24">A typical first path on Azure</text>
  <text x="600" y="64" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">From sign-in to running resources - the usual learning journey</text>

  <!-- Step boxes -->
  <rect x="40" y="100" width="200" height="140" rx="12" fill="#dbeafe" stroke="#0078d4" stroke-width="2"/>
  <circle cx="70" cy="130" r="16" fill="#0078d4"/>
  <text x="70" y="136" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="140" y="160" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Sign in</text>
  <text x="140" y="185" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">Entra ID account</text>
  <text x="140" y="208" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">+ subscription</text>

  <path d="M250 170 L290 170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="300" y="100" width="200" height="140" rx="12" fill="#dbeafe" stroke="#0078d4" stroke-width="2"/>
  <circle cx="330" cy="130" r="16" fill="#0078d4"/>
  <text x="330" y="136" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="400" y="160" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Pick a region</text>
  <text x="400" y="185" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">Close to users</text>
  <text x="400" y="208" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">e.g. East US</text>

  <path d="M510 170 L550 170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="100" width="200" height="140" rx="12" fill="#dbeafe" stroke="#0078d4" stroke-width="2"/>
  <circle cx="590" cy="130" r="16" fill="#0078d4"/>
  <text x="590" y="136" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="660" y="160" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Make a RG</text>
  <text x="660" y="185" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">Resource group</text>
  <text x="660" y="208" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">folder for the app</text>

  <path d="M770 170 L810 170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="820" y="100" width="340" height="140" rx="12" fill="#dbeafe" stroke="#0078d4" stroke-width="2"/>
  <circle cx="850" cy="130" r="16" fill="#0078d4"/>
  <text x="850" y="136" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">4</text>
  <text x="990" y="155" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Create resources</text>
  <text x="990" y="182" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">VNet, VMs, storage, databases...</text>
  <text x="990" y="208" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="12">Pay mainly for what you use</text>

  <!-- Access methods -->
  <text x="600" y="300" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">How you talk to Azure (same cloud, four doors)</text>

  <rect x="40" y="330" width="260" height="130" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="370" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Azure portal</text>
  <text x="170" y="398" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">Browser UI</text>
  <text x="170" y="422" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">Best for learning</text>

  <rect x="320" y="330" width="260" height="130" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="370" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">CLI / PowerShell</text>
  <text x="450" y="398" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">az and Azure PowerShell</text>
  <text x="450" y="422" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">Scriptable ops</text>

  <rect x="600" y="330" width="260" height="130" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="370" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SDKs / REST APIs</text>
  <text x="730" y="398" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">Code talks to Azure</text>
  <text x="730" y="422" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">Apps and automation</text>

  <rect x="880" y="330" width="280" height="130" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1020" y="370" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Infrastructure as Code</text>
  <text x="1020" y="398" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">Bicep, ARM, Terraform</text>
  <text x="1020" y="422" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">Repeatable environments</text>

  <!-- Note -->
  <rect x="40" y="490" width="1120" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="70" y="530" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Two audiences (same as every cloud)</text>
  <text x="70" y="560" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="13">Builders use portal / CLI / APIs / IaC to create and change Azure resources.</text>
  <text x="70" y="585" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="13">End users usually hit your website or app - not the Azure portal.</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
