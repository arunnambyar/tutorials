  <text x="70" y="475" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12">SCPs — org policies on OUs / accounts</text>
  <text x="70" y="500" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12">IAM — who may act inside one account</text>
  <text x="70" y="525" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12">Consolidated billing — one payer invoice</text>
