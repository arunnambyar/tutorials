<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Real cloud structure tree</title>
  <desc id="desc">Organization (company container), root account, folders, projects, then IAM and resources.</desc>
  <rect width="1000" height="720" fill="#f8fafc"/>

  <text x="500" y="34" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">A real cloud structure (generic)</text>
  <text x="500" y="58" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Organization (company) -> root account -> folders -> projects -> IAM + resources</text>

  <!-- Organization / company container -->
  <rect x="275" y="80" width="450" height="48" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="500" y="110" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1. Organization (company container)</text>

  <line x1="500" y1="128" x2="500" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <!-- Root account -->
  <rect x="300" y="160" width="400" height="55" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="185" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2. Root / management account</text>
  <text x="500" y="205" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">payer � owns the organization tree</text>

  <line x1="500" y1="215" x2="500" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="245" x2="800" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="245" x2="200" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="245" x2="500" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <line x1="800" y1="245" x2="800" y2="270" stroke="#94a3b8" stroke-width="2"/>

  <!-- Folders -->
  <rect x="95" y="270" width="210" height="55" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="200" y="295" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">3. Folder</text>
  <text x="200" y="315" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">Security</text>

  <rect x="395" y="270" width="210" height="55" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="295" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">3. Folder</text>
  <text x="500" y="315" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">Platform</text>

  <rect x="695" y="270" width="210" height="55" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="800" y="295" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">3. Folder</text>
  <text x="800" y="315" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">Workloads</text>

  <line x1="200" y1="325" x2="200" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="325" x2="500" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="800" y1="325" x2="800" y2="360" stroke="#94a3b8" stroke-width="2"/>

  <!-- Projects -->
  <rect x="105" y="360" width="190" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="200" y="390" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">4. Project (box)</text>

  <rect x="405" y="360" width="190" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="500" y="390" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">4. Project (box)</text>

  <rect x="705" y="360" width="190" height="50" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="800" y="390" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">4. Project (box)</text>

  <!-- Zoom into one project -->
  <line x1="800" y1="410" x2="800" y2="450" stroke="#94a3b8" stroke-width="2"/>
  <rect x="560" y="450" width="400" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="480" text-anchor="middle" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Inside one project</text>

  <rect x="585" y="500" width="160" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="665" y="545" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">IAM</text>
  <text x="665" y="570" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">who may act</text>
  <text x="665" y="590" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">in this project</text>

  <rect x="775" y="500" width="160" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="855" y="545" text-anchor="middle" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">5. Resources</text>
  <text x="855" y="570" text-anchor="middle" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="11">networks, VMs,</text>
  <text x="855" y="590" text-anchor="middle" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="11">storage, apps...</text>

  <!-- Note left -->
  <rect x="40" y="450" width="480" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="485" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">How to read IAM here</text>
  <text x="60" y="520" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">IAM lives mainly <tspan font-weight="700">inside each project</tspan>.</text>
  <text x="60" y="545" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">It answers: who can create or change</text>
  <text x="60" y="570" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">resources in that project.</text>
  <text x="60" y="605" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">Folders may add policies from above.</text>
  <text x="60" y="625" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">The hard wall is still the project (box).</text>
</svg>
