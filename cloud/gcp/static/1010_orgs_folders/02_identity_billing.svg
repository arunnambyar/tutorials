<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Identity and billing</title>
  <desc id="desc">Cloud Identity for sign-in and Cloud Billing for payment beside the Organization.</desc>
  <rect width="920" height="420" fill="#f8fafc"/>
  <text x="460" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">3. Cloud Identity and billing</text>
  <text x="460" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Who signs in vs who pays  separate from the project box</text>

  <rect x="40" y="75" width="840" height="250" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="60" y="100" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Organization</text>

  <rect x="260" y="120" width="400" height="48" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="150" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Organization</text>

  <line x1="460" y1="168" x2="460" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="200" x2="700" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="200" x2="220" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="200" x2="460" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="200" x2="700" y2="220" stroke="#94a3b8" stroke-width="2"/>

  <rect x="100" y="220" width="240" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="220" y="255" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cloud Identity</text>
  <text x="220" y="278" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="12">who signs in</text>

  <rect x="360" y="220" width="200" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="460" y="255" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Billing account</text>
  <text x="460" y="278" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="12">who pays</text>

  <rect x="580" y="220" width="240" height="80" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="700" y="255" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Projects</text>
  <text x="700" y="278" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">hard boxes (linked to billing)</text>

  <text x="460" y="390" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Billing account ` project. Identity ` Organization tree. Project = where resources live.</text>
</svg>
