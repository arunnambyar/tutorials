<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Generic company cloud tree</title>
  <desc id="desc">Company, optional folders, boundaries, then resources inside a boundary.</desc>
  <rect width="1000" height="560" fill="#f8fafc"/>
  <text x="500" y="36" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="24">How companies usually nest things</text>
  <text x="500" y="62" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Generic picture  provider product names come on the next pages</text>

  <rect x="350" y="90" width="300" height="50" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="500" y="121" text-anchor="middle" fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Company (organization)</text>

  <line x1="500" y1="140" x2="500" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="175" x2="800" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="175" x2="200" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="175" x2="500" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="800" y1="175" x2="800" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <rect x="100" y="200" width="200" height="55" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="200" y="233" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Folder: Security</text>

  <rect x="400" y="200" width="200" height="55" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="233" text-anchor="middle" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Folder: Platform</text>

  <rect x="700" y="200" width="200" height="55" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="800" y="233" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Folder: Workloads</text>

  <line x1="200" y1="255" x2="200" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="255" x2="500" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="800" y1="255" x2="800" y2="290" stroke="#94a3b8" stroke-width="2"/>

  <rect x="115" y="290" width="170" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="320" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Boundary</text>

  <rect x="415" y="290" width="170" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="320" text-anchor="middle" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Boundary</text>

  <rect x="715" y="290" width="170" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="320" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Boundary</text>

  <line x1="800" y1="340" x2="800" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <rect x="650" y="380" width="300" height="120" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="800" y="415" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Inside one boundary</text>
  <text x="800" y="445" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">networks · machines · storage · databases</text>
  <text x="800" y="470" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">(placed in regions  next topics)</text>

  <text x="500" y="535" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Folders are optional grouping. Boundaries are the hard walls.</text>
</svg>
