<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
  <title id="title">Full Organization picture</title>
  <desc id="desc">Organization contains Root OU, management account, OUs, member accounts, IAM and resources.</desc>
  <rect width="920" height="600" fill="#f8fafc"/>
