<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Create order starting from tenant and first subscription</title>
  <desc id="desc">Create tenant and first subscription, use Root MG, create child MGs, add subscriptions, move into MGs.</desc>
  <rect width="1100" height="520" fill="#f8fafc"/>
  <text x="550" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Create order  start with tenant + first subscription</text>
  <text x="550" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Admins with Entra / billing / MG rights shape the tree; pay through the billing account</text>

  <rect x="25" y="80" width="185" height="200" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="55" cy="110" r="16" fill="#7c3aed"/>
  <text x="55" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="117" y="150" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create tenant</text>
  <text x="117" y="172" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">+ first</text>
  <text x="117" y="194" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">subscription</text>
  <text x="117" y="230" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="11">+ billing account</text>
  <text x="117" y="250" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="11">Entra sign-in</text>

  <path d="M218 180 L245 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="255" y="80" width="185" height="200" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="285" cy="110" r="16" fill="#f8fafc"/>
  <text x="285" y="116" text-anchor="middle" fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="347" y="150" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Use Tenant</text>
  <text x="347" y="172" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Root MG</text>
  <text x="347" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="11">already exists</text>
  <text x="347" y="232" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="11">top of the tree</text>
  <text x="347" y="254" text-anchor="middle" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="11">do not delete</text>

  <path d="M448 180 L475 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="485" y="80" width="185" height="200" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="515" cy="110" r="16" fill="#ca8a04"/>
  <text x="515" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="577" y="150" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create child</text>
  <text x="577" y="172" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">MGs</text>
  <text x="577" y="210" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">under Root MG</text>
  <text x="577" y="232" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">(custom names)</text>
  <text x="577" y="254" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">by tenant admins</text>

  <path d="M678 180 L705 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="715" y="80" width="185" height="200" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <circle cx="745" cy="110" r="16" fill="#334155"/>
  <text x="745" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">4</text>
  <text x="807" y="150" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create more</text>
  <text x="807" y="172" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">subscriptions</text>
  <text x="807" y="210" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11">or bring existing</text>
  <text x="807" y="232" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11">into the tenant</text>
  <text x="807" y="254" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">billing linked</text>

  <path d="M908 180 L935 180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="945" y="80" width="130" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="975" cy="110" r="16" fill="#059669"/>
  <text x="975" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">5</text>
  <text x="1010" y="155" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Move</text>
  <text x="1010" y="175" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">subs into</text>
  <text x="1010" y="195" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">MGs</text>
  <text x="1010" y="240" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">by admins</text>

  <rect x="25" y="310" width="1050" height="175" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="50" y="345" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Roles through the whole flow</text>
  <text x="50" y="375" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">1 ’ Create Entra tenant, billing account, and a first subscription (the first hard box).</text>
  <text x="50" y="400" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">2 ’ Tenant Root MG is already there  hang everything under it.</text>
  <text x="50" y="425" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">35 ’ Admins create child MGs, create/move subscriptions, and place them under the right MGs.</text>
  <text x="50" y="455" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Ongoing: Entra = sign-in · billing account = pay · Azure Policy on MGs · keep apps in workload subscriptions.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
