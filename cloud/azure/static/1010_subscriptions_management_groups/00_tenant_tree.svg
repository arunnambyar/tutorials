  <rect x="430" y="330" width="180" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="520" y="352" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Log Archive</text>
  <text x="520" y="368" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">subscription</text>
  <rect x="430" y="395" width="180" height="50" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="520" y="417" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Security Tooling</text>
  <text x="520" y="433" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">subscription</text>
  <text x="520" y="480" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">MG = folder</text>

  <rect x="650" y="255" width="180" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="660" y="270" width="160" height="40" rx="8" fill="#bae6fd" stroke="#0284c7"/>
  <text x="740" y="295" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Infra MG</text>
  <rect x="665" y="330" width="150" height="45" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="740" y="357" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Shared Svcs</text>
  <rect x="665" y="390" width="150" height="45" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="740" y="417" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Connectivity</text>

  <rect x="850" y="255" width="100" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="900" y="310" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Workloads</text>
  <text x="900" y="330" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">MG</text>
  <text x="900" y="365" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="10">can nest</text>
  <text x="900" y="385" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="10">child MGs</text>

  <text x="500" y="645" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Drive = tenant + Root MG · Folder = management group · File = subscription (the real isolation box)</text>
</svg>
