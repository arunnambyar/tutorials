<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Organization tree — drive, folders, accounts</title>
  <desc id="desc">Organization as a drive holding Root OU, management account, nested OUs as folders, and accounts as files.</desc>
  <rect width="1000" height="720" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Organization tree (drive → folders → accounts)</text>
  <text x="500" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Learning picture: Organization ≈ drive · OU ≈ folder · account ≈ file (hard isolation box)</text>

  <!-- Organization = drive -->
  <rect x="40" y="75" width="920" height="590" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <rect x="40" y="75" width="920" height="48" rx="16" fill="#1e293b"/>
  <rect x="40" y="107" width="920" height="16" fill="#1e293b"/>
  <text x="500" y="105" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Organization  (like a drive)</text>

  <!-- Root OU -->
  <rect x="320" y="145" width="360" height="52" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="500" y="168" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Root OU</text>
  <text x="500" y="186" text-anchor="middle" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="11">top-level folder</text>

  <!-- stem from Root -->
  <line x1="500" y1="197" x2="500" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="230" x2="860" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="230" x2="140" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="230" x2="380" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="230" x2="620" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="860" y1="230" x2="860" y2="255" stroke="#94a3b8" stroke-width="2"/>

  <!-- Management account (special file under Root) -->
  <rect x="55" y="255" width="170" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="140" y="285" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Management</text>
  <text x="140" y="305" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">account</text>
  <text x="140" y="328" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">special “file”</text>
  <text x="140" y="345" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="10">billing + org admin</text>

  <!-- Security OU folder -->
  <rect x="245" y="255" width="270" height="355" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <rect x="260" y="270" width="240" height="42" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="297" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Security OU  (folder)</text>

  <rect x="270" y="330" width="220" height="55" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="352" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Log Archive</text>
  <text x="380" y="370" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">account (“file” / box)</text>

  <rect x="270" y="400" width="220" height="55" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="422" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Security Tooling</text>
  <text x="380" y="440" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11">account (“file” / box)</text>

  <text x="380" y="490" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">accounts live inside the OU</text>

  <!-- Infrastructure OU folder -->
  <rect x="535" y="255" width="170" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="545" y="270" width="150" height="42" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <text x="620" y="297" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Infra OU</text>

  <rect x="550" y="330" width="140" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="620" y="350" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Shared Svcs</text>
  <text x="620" y="366" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">account</text>

  <rect x="550" y="390" width="140" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="620" y="410" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Network</text>
  <text x="620" y="426" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">account</text>

  <!-- Workloads OU with nested OU -->
  <rect x="725" y="255" width="215" height="355" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="735" y="270" width="195" height="42" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="832" y="297" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Workloads OU</text>

  <rect x="740" y="325" width="185" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="832" y="345" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">App Staging</text>
  <text x="832" y="362" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="10">account (“file”)</text>

  <!-- nested Production OU -->
  <rect x="740" y="390" width="185" height="150" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="832" y="415" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Production OU</text>
  <text x="832" y="432" text-anchor="middle" fill="#059669" font-family="Arial, Helvetica, sans-serif" font-size="10">(nested folder)</text>

  <rect x="755" y="450" width="155" height="70" rx="6" fill="#fefce8" stroke="#ca8a04"/>
  <text x="832" y="480" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">App Production</text>
  <text x="832" y="498" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="10">account (“file”)</text>

  <text x="832" y="570" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="11">OUs can nest</text>
  <text x="832" y="588" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="11">under other OUs</text>

  <!-- legend -->
  <text x="500" y="645" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12">Drive = Organization · Folder = OU · File = account (the real isolation box / namespace)</text>
</svg>
