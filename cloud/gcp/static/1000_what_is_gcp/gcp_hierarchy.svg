<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Google Cloud organization multi-project layout</title>
  <desc id="desc">Organization with Security, Infrastructure, and Workloads folders containing projects.</desc>
  <rect width="1200" height="820" fill="#f8fafc"/>

  <text x="600" y="34" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="24">How Google Cloud organizes your work</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Resource hierarchy: Organization -&gt; Folders -&gt; Projects (same multi-account idea as AWS/Azure)</text>

  <rect x="400" y="80" width="400" height="50" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="600" y="111" text-anchor="middle" fill="#174ea6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Organization (top level)</text>

  <line x1="600" y1="130" x2="600" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <rect x="320" y="160" width="560" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="190" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Billing Account (linked to projects)</text>

  <line x1="600" y1="208" x2="600" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="235" x2="1040" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="235" x2="160" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="235" x2="600" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="1040" y1="235" x2="1040" y2="255" stroke="#94a3b8" stroke-width="2"/>

  <!-- Security Folder -->
  <rect x="40" y="255" width="240" height="280" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="55" y="270" width="210" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="160" y="295" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Security Folder</text>
  <rect x="55" y="330" width="210" height="70" rx="6" fill="#fff1f2" stroke="#f87171"/>
  <text x="160" y="360" text-anchor="middle" fill="#9f1239" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Log Archive Project</text>
  <text x="160" y="380" text-anchor="middle" fill="#be123c" font-family="Arial, Helvetica, sans-serif" font-size="11">central logs</text>
  <rect x="55" y="420" width="210" height="70" rx="6" fill="#fff1f2" stroke="#f87171"/>
  <text x="160" y="450" text-anchor="middle" fill="#9f1239" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Security Tooling Project</text>
  <text x="160" y="470" text-anchor="middle" fill="#be123c" font-family="Arial, Helvetica, sans-serif" font-size="11">SCC, Chronicle, tooling...</text>

  <!-- Infrastructure Folder -->
  <rect x="480" y="255" width="240" height="280" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="495" y="270" width="210" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="600" y="295" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Infrastructure Folder</text>
  <rect x="495" y="330" width="210" height="70" rx="6" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="600" y="360" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Shared Services Project</text>
  <text x="600" y="380" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">DNS, directories, tooling</text>
  <rect x="495" y="420" width="210" height="70" rx="6" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="600" y="450" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Network / Host Project</text>
  <text x="600" y="470" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">Shared VPC host</text>

  <!-- Workloads Folder -->
  <rect x="920" y="255" width="240" height="370" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="935" y="270" width="210" height="40" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="1040" y="295" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Workloads Folder</text>
  <rect x="935" y="325" width="210" height="110" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1040" y="350" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Staging Folder</text>
  <rect x="950" y="365" width="180" height="55" rx="5" fill="#ffffff" stroke="#22c55e"/>
  <text x="1040" y="390" text-anchor="middle" fill="#15803d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">App-1 Staging Project</text>
  <text x="1040" y="408" text-anchor="middle" fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="10">non-prod app</text>
  <rect x="935" y="450" width="210" height="155" rx="6" fill="#fefce8" stroke="#ca8a04"/>
  <text x="1040" y="475" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Production Folder</text>
  <rect x="950" y="490" width="180" height="45" rx="5" fill="#ffffff" stroke="#eab308"/>
  <text x="1040" y="517" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">App-1 Prod Project</text>
  <rect x="950" y="545" width="180" height="45" rx="5" fill="#ffffff" stroke="#eab308"/>
  <text x="1040" y="572" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">App-2 Prod Project</text>

  <rect x="40" y="650" width="1120" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="685" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Inside every project</text>
  <text x="60" y="715" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">IAM / service accounts  -&gt;  Regions &amp; zones  -&gt;  Resources (Compute Engine, VPC, Cloud Storage...)</text>
  <text x="60" y="740" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">Project is the main unit for APIs, billing linkage, and IAM.</text>
  <text x="60" y="770" fill="#1a73e8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Folder = policy / grouping for projects    |    Project = bill link + blast-radius boundary</text>
</svg>
