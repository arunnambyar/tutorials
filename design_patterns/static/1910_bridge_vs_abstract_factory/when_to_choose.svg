<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <rect width="860" height="300" fill="#f8fafc"/>

  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Which one?</text>

  <!-- Left -->
  <rect x="30" y="60" width="380" height="210" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="30" y="60" width="380" height="44" rx="12" fill="#1e40af"/>
  <rect x="30" y="88" width="380" height="16" fill="#1e40af"/>
  <text x="220" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Choose Abstract Factory</text>

  <rect x="55" y="125" width="330" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="220" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">Need several related parts together</text>

  <rect x="55" y="175" width="330" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="220" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">Illegal mixes must be blocked</text>

  <rect x="55" y="225" width="330" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="220" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">Client picks one product line</text>

  <!-- Right -->
  <rect x="450" y="60" width="380" height="210" rx="12" fill="#ffffff" stroke="#5eead4"/>
  <rect x="450" y="60" width="380" height="44" rx="12" fill="#0f766e"/>
  <rect x="450" y="88" width="380" height="16" fill="#0f766e"/>
  <text x="640" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Choose Bridge</text>

  <rect x="475" y="125" width="330" height="36" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="640" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#115e59">Two dimensions vary independently</text>

  <rect x="475" y="175" width="330" height="36" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="640" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#115e59">Free pairing is allowed</text>

  <rect x="475" y="225" width="330" height="36" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="640" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#115e59">No factory layer needed</text>
</svg>
