<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
  <title id="title">Member accounts inside the Organization</title>
  <desc id="desc">Organization holds Root OU, management account, OUs, and member accounts.</desc>
  <rect width="920" height="640" fill="#f8fafc"/>
  <text x="460" y="30" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">5. Multiple accounts (inside the Organization)</text>
  <text x="460" y="52" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Management account under Root OU; member accounts under each OU</text>

  <rect x="20" y="68" width="880" height="530" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="40" y="92" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Organization</text>

  <rect x="330" y="110" width="260" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="135" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Root OU</text>

  <line x1="460" y1="150" x2="460" y2="175" stroke="#94a3b8" stroke-width="2"/>

  <rect x="260" y="175" width="400" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="460" y="198" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Management account (payer)</text>
  <text x="460" y="216" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">owns this Organization · consolidated billing</text>

  <line x1="460" y1="227" x2="460" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="255" x2="760" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="255" x2="160" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="255" x2="460" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="760" y1="255" x2="760" y2="275" stroke="#94a3b8" stroke-width="2"/>

  <rect x="50" y="275" width="220" height="270" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  <rect x="65" y="290" width="190" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="160" y="315" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Security OU</text>
  <rect x="65" y="345" width="190" height="70" rx="6" fill="#fff1f2" stroke="#f87171"/>
  <text x="160" y="375" text-anchor="middle" fill="#9f1239" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Log Archive</text>
  <text x="160" y="395" text-anchor="middle" fill="#be123c" font-family="Arial, Helvetica, sans-serif" font-size="11">member account</text>
  <rect x="65" y="435" width="190" height="70" rx="6" fill="#fff1f2" stroke="#f87171"/>
  <text x="160" y="465" text-anchor="middle" fill="#9f1239" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Security Tooling</text>
  <text x="160" y="485" text-anchor="middle" fill="#be123c" font-family="Arial, Helvetica, sans-serif" font-size="11">member account</text>

  <rect x="350" y="275" width="220" height="270" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <rect x="365" y="290" width="190" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="460" y="315" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Infrastructure OU</text>
  <rect x="365" y="345" width="190" height="70" rx="6" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="460" y="375" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Shared Services</text>
  <text x="460" y="395" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">member account</text>
  <rect x="365" y="435" width="190" height="70" rx="6" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="460" y="465" text-anchor="middle" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Network / Transit</text>
  <text x="460" y="485" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="11">member account</text>

  <rect x="650" y="275" width="220" height="270" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
  <rect x="665" y="290" width="190" height="40" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="760" y="315" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Workloads OU</text>
  <rect x="665" y="345" width="190" height="70" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="760" y="375" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">App Staging</text>
  <text x="760" y="395" text-anchor="middle" fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="11">member account</text>
  <rect x="665" y="435" width="190" height="70" rx="6" fill="#fefce8" stroke="#eab308"/>
  <text x="760" y="465" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">App Production</text>
  <text x="760" y="485" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">member account</text>

  <text x="460" y="575" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">All of this tree lives in one Organization. Accounts are still the hard walls.</text>
</svg>
