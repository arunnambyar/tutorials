<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="Cloud service models: IaaS, PaaS, and SaaS">
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; fill: #0f172a; }
      .card-title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; fill: #0f172a; font-weight: 700; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #334155; }
      .hint { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
  </defs>
  <rect width="920" height="360" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" class="title">Cloud service models</text>

  <!-- IaaS -->
  <rect x="40" y="60" width="260" height="250" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="60" width="260" height="48" rx="12" fill="#dbeafe"/>
  <rect x="40" y="84" width="260" height="24" fill="#dbeafe"/>
  <text x="170" y="92" text-anchor="middle" class="card-title">IaaS</text>
  <text x="170" y="128" text-anchor="middle" class="hint">Infrastructure as a Service</text>
  <text x="58" y="168" class="body">You rent virtual machines,</text>
  <text x="58" y="190" class="body">storage, and networks.</text>
  <text x="58" y="222" class="body">You manage the OS, runtime,</text>
  <text x="58" y="244" class="body">and applications.</text>
  <text x="58" y="276" class="hint">Examples: EC2, Azure VMs,</text>
  <text x="58" y="294" class="hint">Compute Engine</text>

  <!-- PaaS -->
  <rect x="330" y="60" width="260" height="250" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="330" y="60" width="260" height="48" rx="12" fill="#dcfce7"/>
  <rect x="330" y="84" width="260" height="24" fill="#dcfce7"/>
  <text x="460" y="92" text-anchor="middle" class="card-title">PaaS</text>
  <text x="460" y="128" text-anchor="middle" class="hint">Platform as a Service</text>
  <text x="348" y="168" class="body">You deploy code onto a</text>
  <text x="348" y="190" class="body">managed platform.</text>
  <text x="348" y="222" class="body">The provider manages OS,</text>
  <text x="348" y="244" class="body">runtime, and scaling.</text>
  <text x="348" y="276" class="hint">Examples: Elastic Beanstalk,</text>
  <text x="348" y="294" class="hint">App Service, App Engine</text>

  <!-- SaaS -->
  <rect x="620" y="60" width="260" height="250" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="620" y="60" width="260" height="48" rx="12" fill="#ffedd5"/>
  <rect x="620" y="84" width="260" height="24" fill="#ffedd5"/>
  <text x="750" y="92" text-anchor="middle" class="card-title">SaaS</text>
  <text x="750" y="128" text-anchor="middle" class="hint">Software as a Service</text>
  <text x="638" y="168" class="body">You use a finished</text>
  <text x="638" y="190" class="body">application in the browser.</text>
  <text x="638" y="222" class="body">The provider runs almost</text>
  <text x="638" y="244" class="body">everything for you.</text>
  <text x="638" y="276" class="hint">Examples: Gmail, Office 365,</text>
  <text x="638" y="294" class="hint">Salesforce</text>
</svg>
