<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Azure tenant tree  drive, folders, subscriptions</title>
  <desc id="desc">Tenant as a drive holding Root MG, Entra, billing, nested MGs as folders, and subscriptions as files.</desc>
  <rect width="1000" height="720" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Azure tenant tree (drive ’ folders ’ subscriptions)</text>
  <text x="500" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Learning picture: Tenant H drive · MG H folder · subscription H file (hard isolation box)</text>

  <rect x="40" y="75" width="920" height="590" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <rect x="40" y="75" width="920" height="48" rx="16" fill="#1e293b"/>
  <rect x="40" y="107" width="920" height="16" fill="#1e293b"/>
  <text x="500" y="105" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Tenant + Root MG  (like a drive)</text>

  <rect x="280" y="145" width="440" height="52" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="500" y="168" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Tenant Root Management Group</text>
  <text x="500" y="186" text-anchor="middle" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="11">top-level folder</text>

  <line x1="500" y1="197" x2="500" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="230" x2="880" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="230" x2="120" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="230" x2="300" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="520" y1="230" x2="520" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="740" y1="230" x2="740" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="230" x2="880" y2="255" stroke="#94a3b8" stroke-width="2"/>

  <rect x="50" y="255" width="140" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="290" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Entra ID</text>
  <text x="120" y="310" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="11">tenant</text>
  <text x="120" y="332" text-anchor="middle" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="10">who signs in</text>

  <rect x="210" y="255" width="180" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="290" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Billing account</text>
  <text x="300" y="310" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">who pays</text>
  <text x="300" y="332" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="10">invoices</text>

  <rect x="410" y="255" width="220" height="320" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <rect x="425" y="270" width="190" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
