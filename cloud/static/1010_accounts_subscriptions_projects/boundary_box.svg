<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">What a cloud boundary is</title>
  <desc id="desc">A simple box that holds billing, access control, and resources together.</desc>
  <rect width="1000" height="480" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="24">A billing and isolation boundary</text>
  <text x="500" y="68" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">One container for money, permissions, and resources</text>

  <rect x="200" y="110" width="600" height="300" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="500" y="155" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Your cloud boundary</text>
  <text x="500" y="180" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">(account / subscription / project  details later)</text>

  <rect x="240" y="210" width="160" height="140" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="270" text-anchor="middle" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Bill</text>
  <text x="320" y="298" text-anchor="middle" fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="12">who pays</text>

  <rect x="420" y="210" width="160" height="140" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="500" y="270" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Access</text>
  <text x="500" y="298" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="12">who may act</text>

  <rect x="600" y="210" width="160" height="140" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="680" y="270" text-anchor="middle" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Resources</text>
  <text x="680" y="298" text-anchor="middle" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="12">what you run</text>

  <text x="500" y="450" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Think of it as a sealed box: limits the blast radius when something goes wrong</text>
</svg>
