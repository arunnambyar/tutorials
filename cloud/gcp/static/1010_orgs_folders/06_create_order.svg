<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Create order for GCP Organization</title>
  <desc id="desc">Cloud Identity and Organization, billing, folders, projects, place under folders.</desc>
  <rect width="1100" height="500" fill="#f8fafc"/>
  <text x="550" y="32" text-anchor="middle" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Create order  start with Organization</text>
  <text x="550" y="56" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Domain + Cloud Identity ’ Organization ’ billing ’ folders ’ projects</text>

  <rect x="25" y="80" width="185" height="190" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="55" cy="110" r="16" fill="#7c3aed"/>
  <text x="55" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="117" y="150" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Cloud Identity</text>
  <text x="117" y="172" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">+ Organization</text>
  <text x="117" y="210" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="11">company domain</text>
  <text x="117" y="232" text-anchor="middle" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="11">named Organization</text>

  <path d="M218 175 L245 175" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="255" y="80" width="185" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="285" cy="110" r="16" fill="#dc2626"/>
  <text x="285" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="347" y="155" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create Cloud</text>
  <text x="347" y="177" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Billing account</text>
  <text x="347" y="220" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="11">who pays Google</text>

  <path d="M448 175 L475 175" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="485" y="80" width="185" height="190" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="515" cy="110" r="16" fill="#ca8a04"/>
  <text x="515" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="577" y="155" text-anchor="middle" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create folders</text>
  <text x="577" y="190" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">under Organization</text>
  <text x="577" y="212" text-anchor="middle" fill="#a16207" font-family="Arial, Helvetica, sans-serif" font-size="11">(custom names)</text>
  <text x="577" y="240" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">by org admins</text>

  <path d="M678 175 L705 175" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="715" y="80" width="185" height="190" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <circle cx="745" cy="110" r="16" fill="#334155"/>
  <text x="745" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">4</text>
  <text x="807" y="155" text-anchor="middle" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Create projects</text>
  <text x="807" y="190" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11">link billing</text>
  <text x="807" y="212" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11">enable APIs</text>
  <text x="807" y="240" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">hard boxes</text>

  <path d="M908 175 L935 175" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="945" y="80" width="130" height="190" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="975" cy="110" r="16" fill="#059669"/>
  <text x="975" y="116" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">5</text>
  <text x="1010" y="155" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Place</text>
  <text x="1010" y="175" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">projects</text>
  <text x="1010" y="195" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="12">in folders</text>
  <text x="1010" y="235" text-anchor="middle" fill="#7f1d1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">by admins</text>

  <rect x="25" y="300" width="1050" height="160" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="335" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">GCP has a named Organization (like AWS)</text>
  <text x="50" y="365" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">12 ’ Domain + Cloud Identity create the Organization; add a Cloud Billing account.</text>
  <text x="50" y="390" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13">35 ’ Create folders, create projects, link billing, place projects under folders.</text>
  <text x="50" y="420" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13">Ongoing: Identity = sign-in · Billing = pay · Folders = policy · Projects = where work runs.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
